# stats.zachgreen.codes: Umami, the site's analytics (deploy/umami/compose.yaml).
# Installed by deploy/setup-umami.sh.
#
# On the server this is /etc/nginx/sites-available/stats.zachgreen.codes, linked from
# sites-enabled/. It relies on conf.d/zachgreen-umami.conf (the umami_login zone) and on
# its own certificate, /etc/letsencrypt/live/stats.zachgreen.codes/. Umami listens on
# 127.0.0.1:3000 only, so this is the one way in.
#
# The site's tracker loads /insights from here and sends its beacons to /api/send, both
# from https://zachgreen.codes. Umami's own CORS headers allow that, and they pass through
# untouched. Neither is rate-limited: only the login is. /api/send has short proxy
# timeouts of its own, so a stuck Umami can't hold a visitor's click for long (below).
#
# Umami sends its own Content-Security-Policy, which its dashboard is built for and which
# has frame-ancestors 'self', so this adds no CSP and no X-Frame-Options, and not the
# site's snippets/security-headers.conf.
#
# setup-umami.sh installs the first server block on its own before the certificate
# exists, for certbot's HTTP challenge, so it must stay first and stay plain HTTP.
#
# tests/nginx/nginx.test.ts runs this config in Docker; `pnpm test:live` checks production.

# Plain HTTP: everything goes to HTTPS. certbot's nginx authenticator answers its
# challenge in this block while it runs, ahead of the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name stats.zachgreen.codes;
    server_tokens off;

    return 301 https://stats.zachgreen.codes$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.zachgreen.codes;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/stats.zachgreen.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.zachgreen.codes/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No location below has its own add_header or proxy_set_header: one that gets one
    # must repeat all of these, since nginx drops every inherited one in a block that
    # sets its own. `always` adds them to errors and 429s as well.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_hide_header X-Powered-By;

    # nginx is the first hop, so it sets the client's address rather than passing on what
    # the client sent. Umami reads X-Real-IP (CLIENT_IP_HEADER in compose.yaml).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=umami_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # The tracker holds a click on a tracked link until its beacon is answered, and has no
    # timeout of its own. A stuck Umami is cut off here, with a 504, in seconds and not
    # nginx's default 60, and the tracker then follows the link as it does after any failure.
    location = /api/send {
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
