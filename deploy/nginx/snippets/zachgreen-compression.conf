# gzip for the zachgreen.codes apex server block (server context).
# On the server: /etc/nginx/snippets/zachgreen-compression.conf.
#
# Server-level on purpose: in the http block it would also change the responses of the
# other sites on the box (Foundry). Ubuntu's nginx.conf already has `gzip on;` in the
# http block; repeating it here is fine because this is a different context.
#
# text/html is always compressed and mustn't be listed. Keep the types in step with
# brotli_types in zachgreen-brotli.conf.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;
