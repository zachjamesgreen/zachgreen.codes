# Security headers and Cache-Control for zachgreen.codes HTTPS responses (spec §8).
# On the server: /etc/nginx/snippets/security-headers.conf.
#
# Include it in each HTTPS server block, and again in any location that has its own
# add_header: nginx drops every inherited add_header in a block that sets one. `always`
# adds the headers to error and redirect responses as well.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.zachgreen.codes; connect-src 'self' https://stats.zachgreen.codes; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
# Short to start with (spec §8). Raise it, and consider preload, once the site has settled.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# From the map in conf.d/zachgreen.conf. When it's empty, nginx leaves the header out.
add_header Cache-Control $cache_control always;
