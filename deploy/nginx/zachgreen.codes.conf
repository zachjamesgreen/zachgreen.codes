# zachgreen.codes, the static site.
#
# On the server this is /etc/nginx/sites-available/zachgreen.codes, linked from
# sites-enabled/. It relies on these files from this directory:
#   conf.d/zachgreen.conf                -> /etc/nginx/conf.d/     the $cache_control map (http context)
#   snippets/security-headers.conf       -> /etc/nginx/snippets/   security headers, Cache-Control
#   snippets/zachgreen-compression.conf  -> /etc/nginx/snippets/   gzip
#   snippets/zachgreen-brotli.conf       -> /etc/nginx/snippets/   brotli (libnginx-mod-http-brotli-filter)
#
# Compression is set per server, not in the http block, so the other sites on the box
# (Foundry) keep their own behaviour.
#
# The certificate lines and the two certbot includes are the ones certbot manages, so
# `certbot renew` keeps working. Hostnames other than these never reach this file: the
# server's catch-all default_server answers them with 444 and refuses unknown SNI names.
#
# tests/nginx/nginx.test.ts runs this config in Docker; `pnpm test:live` checks production.

# Plain HTTP: everything goes to the HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name zachgreen.codes www.zachgreen.codes;
    server_tokens off;

    return 301 https://zachgreen.codes$request_uri;
}

# HTTPS on www: the apex is canonical.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zachgreen.codes;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/zachgreen.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zachgreen.codes/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # For HSTS on www as well.
    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://zachgreen.codes$request_uri;
}

# HTTPS on the apex: the site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zachgreen.codes;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/zachgreen.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zachgreen.codes/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The repo is cloned to /var/www/zachgreen.codes and only site/ is public, so .git/,
    # docs/, scripts/, deploy/ and package.json are out of reach.
    root /var/www/zachgreen.codes/site;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    # A directory without an index.html (/css/) would get nginx's own 403 page: show
    # the site's 404 instead, and don't confirm that the directory exists.
    error_page 403 =404 /404.html;

    include /etc/nginx/snippets/zachgreen-compression.conf;
    # A glob, so a host without the brotli module (the Docker test) can leave the file
    # out: a glob that matches nothing is fine, a missing plain include isn't.
    include /etc/nginx/snippets/zachgreen-brotli*.conf;

    # No location below has its own add_header. One that gets one must include this file
    # again: nginx drops every inherited add_header in a block that sets its own.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        # A directory requested without its slash (/settlor) gets nginx's 301 to /settlor/.
        try_files $uri $uri/ =404;
    }

    # Backstop: never serve a dotfile (.git, .env, ...), wherever one turns up.
    location ~ /\. {
        return 404;
    }
}
