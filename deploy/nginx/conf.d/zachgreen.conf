# http context. On the server: /etc/nginx/conf.d/zachgreen.conf.
#
# Only the map lives here, because a map has to be in the http block. It does nothing
# for other sites: only snippets/security-headers.conf reads $cache_control.
#
# Cache-Control by response type. Types not listed get no header. There's no build
# step, so CSS, JS and images can't carry hashed names: they get a day, and `?v=` query
# strings are bumped by hand when they change. Fonts get a year, so a font file gets a
# new name whenever it changes.
map $sent_http_content_type $cache_control {
    default                              "";
    ~^text/html                          "no-cache";
    ~^font/woff2$                        "public, max-age=31536000, immutable";
    ~^text/css                           "public, max-age=86400";
    ~^(?:text|application)/javascript    "public, max-age=86400";
    ~^image/                             "public, max-age=86400";
    ~^application/pdf$                   "public, max-age=3600";
}
