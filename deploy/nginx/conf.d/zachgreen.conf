# http context. On the server: /etc/nginx/conf.d/zachgreen.conf.
# Used by the server blocks in zachgreen.codes.conf.

# What to compress. The apex server block switches gzip on (the note there says why it
# can't be here). text/html is always compressed and mustn't be listed. Keep these types
# in step with brotli_types in zachgreen-brotli.conf.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

# Cache-Control by response type, sent by snippets/security-headers.conf. Types not
# listed get no header. There's no build step, so CSS, JS and images can't carry hashed
# names: they get a day, and `?v=` query strings are bumped by hand when they change.
# Fonts get a year, so a font file gets a new name whenever it changes.
map $sent_http_content_type $cache_control {
    default                              "";
    ~^text/html                          "no-cache";
    ~^font/woff2$                        "public, max-age=31536000, immutable";
    ~^text/css                           "public, max-age=86400";
    ~^(?:text|application)/javascript    "public, max-age=86400";
    ~^image/                             "public, max-age=86400";
    ~^application/pdf$                   "public, max-age=3600";
}
