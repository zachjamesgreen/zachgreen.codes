# http context. On the server: /etc/nginx/conf.d/zachgreen-umami.conf.
# Installed by deploy/setup-umami.sh, with stats.zachgreen.codes.conf, which uses it.
#
# The rate limit on Umami's login (`location = /api/auth/login` there), so the dashboard's
# public login page can't be used to guess passwords quickly: 5 attempts a minute per
# client address, after a burst of 3. A zone only counts what a location sends to it,
# so it does nothing for other sites.
limit_req_zone $binary_remote_addr zone=umami_login:10m rate=5r/m;
