# http context. On the server: /etc/nginx/conf.d/zachgreen-brotli.conf.
#
# Needs Ubuntu's libnginx-mod-http-brotli-filter package, which loads the module from
# /etc/nginx/modules-enabled/. It's a separate file so the Docker test can leave it out:
# the stock nginx image has no brotli module, and an unknown directive fails `nginx -t`.
#
# text/html is always compressed. Keep the types in step with gzip_types in zachgreen.conf.
brotli on;
brotli_types text/css text/plain text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;
